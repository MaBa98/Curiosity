name: Update curiosities

on:
  schedule:
    - cron: "17 5 * * *"   # ogni giorno alle 05:17 UTC
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Nuove curiosità da aggiungere"
        default: "20"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run scraper
        run: python scraper_etl.py --batch-size "${{ github.event.inputs.batch_size || '20' }}" --lang it

      - name: Commit JSON if changed
        run: |
          if [ -n "$(git status --porcelain curiosities_db.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add curiosities_db.json
            git commit -m "chore: aggiorna curiosities_db.json"
            git push
          else
            echo "Nessuna modifica."
          fi
